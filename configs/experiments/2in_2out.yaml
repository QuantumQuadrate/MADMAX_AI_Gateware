experiment:
  name: 2in_2out
  description: Low-latency 2 input / 2 output entangler smoke configuration.

target:
  board: kasli_soc
  artiq_version: 7
  variant: entangler_1dio_2in_2out

repositories:
  artiq_env_path: repos/madmax-artiq-env
  entangler_core_path: repos/madmax-entangler-core
  artiq_zynq_path: repos/madmax-artiq-zynq

hardware:
  dio_eem: 0
  input_pads:
    - dio0
    - dio1
  output_pads:
    - dio2
    - dio3

entangler:
  num_inputs: 2
  num_outputs: 2
  coincidence_window_mu: 250
  timeout_mu: 10000
  fast_branch: true
  requested_goal: low-latency branch decision

build:
  output_dir: build/generated
  dry_run: true
  command_template: "cp {entangler_settings_path} {artiq_zynq_path}/entangler_settings.toml && scripts/build_from_json.sh {artiq_description_json} standalone {output_dir}/artifacts"
