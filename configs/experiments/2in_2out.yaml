experiment:
  name: "2in_2out"
  description: "Simple 2 input 2 output entangler test"

target:
  board: "kasli_soc"
  artiq_version: 7
  variant: "default"

repositories:
  entangler_core_path: "repos/madmax-entangler-core"
  artiq_zynq_path: "repos/madmax-artiq-zynq"

hardware:
  dio_eem: 0
  input_pads: ["DIO0", "DIO1"]
  output_pads: ["DIO2", "DIO3"]

entangler:
  num_inputs: 2
  num_outputs: 2
  coincidence_window_mu: 100
  timeout_mu: 1000
  fast_branch: true

build:
  output_dir: "build"
  dry_run: true
  command_template: "cd {repositories[artiq_zynq_path]} && make build BOARD={target[board]} VARIANT={target[variant]}"