[project]
name = "madmax-ai-gateware"
version = "0.1.0"
description = "AI-assisted workspace for MADMAX Kasli-SoC gateware development"
authors = [{name = "QuantumQuadrate", email = "info@quantumquadrate.com"}]
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "pyyaml",
    "jinja2",
    "typer",
    "rich",
    "pytest"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["madmax_ai_gateware"]

[project.scripts]
madmax = "madmax_ai_gateware.cli:app"