[project]
name = "madmax-ai-gateware"
version = "0.1.0"
description = "AI-assisted workspace for MADMAX Kasli-SoC gateware development"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "QuantumQuadrate" }]
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
gui = [
    "pyside6>=6.7,<6.10",
]

[project.scripts]
madmax = "madmax_ai_gateware.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/madmax_ai_gateware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.workspace]
members = [
    "img",
]
