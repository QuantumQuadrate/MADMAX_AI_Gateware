experiment:
  name: atom_photon_parity_6
  description: Gateware helper for the timing-critical branch in atom_photon_parity_6_experiment.

target:
  board: kasli_soc
  artiq_version: 7
  variant: SNAQ-Node-1
  hw_rev: v1.0
  drtio_role: standalone
  rtio_frequency: 125000000.0

repositories:
  artiq_env_path: repos/madmax-artiq-env
  entangler_core_path: repos/madmax-entangler-core
  entangler_core_branch: feature/atom-photon-parity-gateware-redesign
  artiq_zynq_path: repos/madmax-artiq-zynq

hardware:
  dio_eem: 0
  edge_counter: true
  input_pads:
    - dio0
    - dio1
  output_pads:
    - dio2
    - dio3
    - dio4
    - dio5

entangler:
  num_inputs: 2
  num_outputs: 4
  # Keep DIO0[2] and DIO0[3] exported as normal ARTIQ TTL inputs even though
  # the parity helper only consumes DIO0[0] and DIO0[1].
  num_generic_inputs: 2
  num_patterns_allowed: 2
  coincidence_window_mu: 250
  timeout_mu: 100000
  fast_branch: true
  requested_goal: SPCM0/SPCM1 single-click classification with click-relative branch outputs for parity 6.
  input_names:
    - spcm0
    - spcm1
  output_names:
    - fort_or_loopback_pulse
    - excitation_or_branch_debug
    - microwave_branch_pulse
    - mw_rf_branch_pulse
  patterns:
    - name: spcm0_only
      inputs: [0]
    - name: spcm1_only
      inputs: [1]

build:
  output_dir: gateware_build/generated
  artifact_dir: gateware_build/artifacts
  description_json: gateware_build/descriptions/atom_photon_parity_6.json
  dry_run: true
  command_template: "cd {artiq_zynq_path} && nix develop --command bash -lc 'cd src && python gateware/{board}.py -g {gateware_build_dir} {artiq_description_json}'"
